<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AHMED TV | Full Pro Edition</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --ios-blur: blur(35px);
      --ios-bg: rgba(255, 255, 255, 0.08);
      --ios-border: rgba(255, 255, 255, 0.15);
      --accent: #007aff;
      --danger: #ff3b30;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      font-family: 'Readex Pro', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1a2a3a 0%, #000 100%);
      overflow-x: hidden;
      padding-bottom: 120px;
    }

    /* شاشة الحماية */
    #protection-screen {
      position: fixed; inset: 0; background: #000; z-index: 10000;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      padding: 30px; text-align: center;
    }
    .warning-box {
      background: var(--ios-bg); backdrop-filter: var(--ios-blur);
      border: 1px solid var(--ios-border); border-radius: 30px;
      padding: 40px 20px; max-width: 400px; width: 100%;
    }
    .warning-box i { font-size: 60px; color: var(--danger); margin-bottom: 25px; }
    .warning-box h2 { font-size: 20px; margin-bottom: 15px; font-weight: 700; }
    .warning-box p { font-size: 14px; opacity: 0.7; line-height: 1.6; margin-bottom: 25px; }
    .btn-retry { background: var(--accent); color: white; border: none; padding: 12px 30px; border-radius: 15px; font-family: inherit; font-weight: 600; cursor: pointer; }

    header {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: var(--ios-blur);
      padding: 12px 20px 15px;
      border-bottom: 0.5px solid var(--ios-border);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .menu-btn { background: var(--ios-bg); border: 0.5px solid var(--ios-border); width: 40px; height: 40px; border-radius: 12px; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .brand-container { text-align: center; flex: 1; }
    .brand-name { font-size: 22px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
    .brand-name span { color: var(--accent); }

    .search-container {
      display: flex; align-items: center;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 14px; padding: 8px 15px;
      border: 0.5px solid var(--ios-border);
    }
    .search-container input {
      background: none; border: none; color: white; width: 100%;
      outline: none; font-family: inherit; font-size: 14px; margin-right: 10px;
    }

    /* الأقسام الرئيسية والفرعية */
    .main-cats { display: flex; gap: 8px; padding: 130px 20px 10px; max-width: 600px; margin: 0 auto; }
    .main-cat-btn { flex: 1; padding: 10px; background: var(--ios-bg); border: 0.5px solid var(--ios-border); border-radius: 14px; color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; font-family: inherit; transition: 0.3s; }
    .main-cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); }

    .sub-cats { display: flex; gap: 8px; padding: 0 20px 15px; overflow-x: auto; white-space: nowrap; max-width: 600px; margin: 0 auto; }
    .sub-cats::-webkit-scrollbar { display: none; }
    .sub-cat-btn { padding: 6px 14px; background: var(--ios-bg); border: 0.5px solid var(--ios-border); border-radius: 12px; color: rgba(255,255,255,0.6); font-size: 12px; cursor: pointer; font-family: inherit; transition: 0.2s; }
    .sub-cat-btn.active { background: rgba(255,255,255,0.2); color: #fff; border-color: #fff; font-weight: 600; }

    .app-container { padding: 0 20px; max-width: 600px; margin: 0 auto; }
    
    /* شبكة الكروت التدريجية */
    .content-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .glass-card {
      background: var(--ios-bg);
      backdrop-filter: var(--ios-blur);
      border: 1px solid var(--ios-border);
      border-radius: 22px; padding: 12px; text-align: center;
      position: relative; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      transition: all 0.3s ease; text-decoration: none; color: white;
    }
    .glass-card:active { transform: scale(0.96); background: rgba(255,255,255,0.15); }

    .card-img { width: 100%; height: 110px; object-fit: contain; border-radius: 14px; background: rgba(0,0,0,0.2); padding: 8px; margin-bottom: 10px; }
    .card-poster { width: 100%; height: 160px; object-fit: cover; border-radius: 14px; margin-bottom: 10px; }
    .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .live-badge { position: absolute; top: 10px; right: 10px; background: var(--danger); color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
    .fav-card-btn { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 0.5px solid var(--ios-border); width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; transition: 0.2s; }
    .fav-card-btn.active { color: var(--danger); background: rgba(255, 59, 48, 0.15); border-color: var(--danger); }

    /* نافذة تفاصيل المسلسل (الأجزاء والحلقات) */
    #seriesModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: var(--ios-blur); z-index: 4000; display: none; flex-direction: column; overflow-y: auto; padding: 20px; }
    .series-header { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
    .series-poster { width: 100px; height: 140px; object-fit: cover; border-radius: 12px; border: 1px solid var(--ios-border); }
    .season-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .season-tab { padding: 8px 16px; background: var(--ios-bg); border: 1px solid var(--ios-border); border-radius: 10px; color: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .season-tab.active { background: var(--accent); border-color: var(--accent); }
    .episodes-list { display: flex; flex-direction: column; gap: 10px; }
    .episode-item { display: flex; align-items: center; gap: 12px; background: var(--ios-bg); border: 1px solid var(--ios-border); padding: 10px; border-radius: 14px; cursor: pointer; }
    .episode-img { width: 80px; height: 50px; object-fit: cover; border-radius: 8px; background: #111; }
    .episode-info h4 { font-size: 13px; margin-bottom: 3px; }
    .episode-info p { font-size: 11px; opacity: 0.6; }

    /* القائمة الجانبية */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2500; display: none; backdrop-filter: blur(5px); }
    .side-drawer { position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; background: rgba(18, 18, 20, 0.95); backdrop-filter: var(--ios-blur); z-index: 3000; border-left: 1px solid var(--ios-border); transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); display: flex; flex-direction: column; }
    .side-drawer.open { right: 0; }
    .drawer-header { padding: 35px 20px; background: linear-gradient(135deg, rgba(0,122,255,0.3), transparent); text-align: center; border-bottom: 0.5px solid var(--ios-border); }
    .drawer-avatar { width: 65px; height: 65px; background: var(--ios-bg); border: 1px solid var(--ios-border); border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--accent); }
    .drawer-menu-list { padding: 15px 0; flex: 1; }
    .drawer-item { padding: 15px 22px; display: flex; align-items: center; gap: 15px; color: #fff; font-size: 14px; text-decoration: none; cursor: pointer; transition: 0.2s; border-right: 3px solid transparent; }
    .drawer-item:active { background: rgba(255,255,255,0.06); color: var(--accent); border-right-color: var(--accent); }
    .drawer-item i { font-size: 18px; width: 24px; text-align: center; color: var(--accent); }

    /* مشغل الفيديو */
    #videoModal { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    #videoPlayer { width: 100%; max-height: 80vh; background: #000; outline: none; }
    .player-close-btn { position: absolute; top: 20px; left: 20px; background: var(--ios-bg); backdrop-filter: var(--ios-blur); border: 0.5px solid var(--ios-border); color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5001; }

    /* الشريط السفلي */
    .tab-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 450px; height: 65px; background: rgba(25, 25, 25, 0.75);
      backdrop-filter: var(--ios-blur); border-radius: 32px;
      border: 1.5px solid var(--ios-border);
      display: flex; justify-content: space-around; align-items: center; z-index: 1000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .tab-item { color: rgba(255,255,255,0.4); text-decoration: none; text-align: center; font-size: 10px; cursor: pointer; flex: 1; transition: 0.2s; }
    .tab-item i { font-size: 20px; display: block; margin-bottom: 3px; }
    .tab-item.active { color: var(--accent); font-weight: 600; }

    .loader { text-align: center; grid-column: span 2; padding: 40px; color: rgba(255,255,255,0.4); font-size: 14px; }
    .load-more-btn { grid-column: span 2; padding: 12px; background: var(--ios-bg); border: 1px solid var(--ios-border); border-radius: 14px; color: #fff; font-weight: 600; cursor: pointer; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- شاشة الحماية -->
  <div id="protection-screen">
    <div class="warning-box">
      <i class="fas fa-shield-halved"></i>
      <h2>تنبيه أمني</h2>
      <p>يجب إيقاف <b>AdGuard DNS</b> أو <b>VPN</b> لتشغيل التطبيق بدون مشاكل في البث.</p>
      <button class="btn-retry" onclick="location.reload()">تحديث الصفحة</button>
    </div>
  </div>

  <!-- القائمة الجانبية -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
  <div class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <div class="drawer-avatar"><i class="fas fa-tv"></i></div>
      <h3 style="font-size: 18px;">AHMED TV</h3>
      <p style="font-size: 11px; opacity: 0.6; margin-top: 4px;">متعدد السيرفرات الاحترافي</p>
    </div>
    <div class="drawer-menu-list">
      <a href="https://t.me/AHMEDTVGY" target="_blank" class="drawer-item">
        <i class="fab fa-telegram"></i> قناة التليجرام
      </a>
      <div class="drawer-item" onclick="shareApp()">
        <i class="fas fa-share-nodes"></i> مشاركة التطبيق
      </div>
      <div class="drawer-item" onclick="toggleDrawer(); switchTab('favorites')">
        <i class="fas fa-heart" style="color: var(--danger);"></i> المفضلة
      </div>
    </div>
  </div>

  <!-- نافذة تفاصيل المسلسل -->
  <div id="seriesModal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3 id="seriesModalTitle" style="font-size:16px;">تفاصيل المسلسل</h3>
      <button onclick="closeSeriesModal()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="series-header">
      <img id="seriesModalPoster" class="series-poster" src="" alt="">
      <div>
        <p id="seriesModalDesc" style="font-size:12px; opacity:0.7; line-height:1.5; max-height:90px; overflow-y:auto;"></p>
      </div>
    </div>
    <div class="season-tabs" id="seasonTabs"></div>
    <div class="episodes-list" id="episodesList"></div>
  </div>

  <!-- مشغل الفيديو المنبثق -->
  <div id="videoModal">
    <button class="player-close-btn" onclick="closePlayer()"><i class="fas fa-xmark"></i></button>
    <video id="videoPlayer" controls autoplay playsinline></video>
  </div>

  <!-- الهيدر -->
  <header>
    <div class="header-top">
      <button class="menu-btn" onclick="toggleDrawer()"><i class="fas fa-bars"></i></button>
      <div class="brand-container"><div class="brand-name">AHMED <span>TV</span></div></div>
      <div style="width: 40px;"></div>
    </div>
    <div class="search-container">
      <i class="fas fa-search" style="color: rgba(255,255,255,0.4);"></i>
      <input type="text" id="searchInput" placeholder="ابحث عن قناة أو فيلم أو مسلسل..." oninput="handleSearch(this.value)">
    </div>
  </header>

  <!-- الأقسام الرئيسية -->
  <div class="main-cats">
    <button class="main-cat-btn active" id="btnLive" onclick="switchTab('live')"><i class="fas fa-broadcast-tower"></i> القنوات</button>
    <button class="main-cat-btn" id="btnMovies" onclick="switchTab('movies')"><i class="fas fa-film"></i> الأفلام</button>
    <button class="main-cat-btn" id="btnSeries" onclick="switchTab('series')"><i class="fas fa-th-large"></i> المسلسلات</button>
  </div>

  <div class="sub-cats" id="subCatsBar"></div>

  <!-- المحتوى الرئيسي -->
  <main class="app-container">
    <div class="content-grid" id="contentGrid">
      <div class="loader">جاري التحميل التدريجي للمحتوى...</div>
    </div>
    <div id="loadMoreContainer"></div>
  </main>

  <!-- الشريط السفلي -->
  <nav class="tab-bar">
    <a class="tab-item active" id="tabLive" onclick="switchTab('live')"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a class="tab-item" id="tabMovies" onclick="switchTab('movies')"><i class="fas fa-film"></i><span>الأفلام</span></a>
    <a class="tab-item" id="tabSeries" onclick="switchTab('series')"><i class="fas fa-tv"></i><span>المسلسلات</span></a>
    <a class="tab-item" id="tabFav" onclick="switchTab('favorites')"><i class="fas fa-heart"></i><span>المفضلة</span></a>
  </nav>

  <script>
    // السيرفرات الثلاثة المطلوبة
    const accounts = [
      { host: "http://vipxtv.net:80", user: "yousrybasha90", pass: "828274919478182" },
      { host: "http://sansatplus.net:88", user: "02077332242203", pass: "qBN8x0pwUJ4e6AA" },
      { host: "http://legendking.net:8080", user: "8c%3Aea%3A48%3A86%3Aa1%3A21", pass: "EFQVuf6xa2SwdkT" }
    ];

    let currentSection = 'live';
    let categoriesList = [];
    let fullDataList = [];
    let filteredList = [];
    let displayedCount = 0;
    const pageSize = 20; // العرض التدريجي لمنع تهنيج الجهاز
    let favorites = JSON.parse(localStorage.getItem('ahmed_tv_favs') || '[]');
    let hlsInstance = null;
    let currentActiveAccount = accounts[0]; // السيرفر الافتراضي الأول

    async function checkSecurity() {
      try {
        await fetch('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js', { mode: 'no-cors', cache: 'no-store' });
      } catch (e) {
        document.getElementById('protection-screen').style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
    }
    checkSecurity();

    function toggleDrawer() {
      const drawer = document.getElementById('sideDrawer');
      const overlay = document.getElementById('drawerOverlay');
      drawer.classList.toggle('open');
      overlay.style.display = drawer.classList.contains('open') ? 'block' : 'none';
    }

    function shareApp() {
      const shareUrl = "http://action_share";
      if (navigator.share) {
        navigator.share({ title: 'AHMED TV', text: 'تابع أروع القنوات والأفلام والمسلسلات عبر تطبيق AHMED TV', url: shareUrl }).catch(() => {});
      } else {
        alert(shareUrl);
      }
    }

    window.onload = () => { switchTab('live'); };

    function switchTab(section) {
      currentSection = section;
      document.getElementById('searchInput').value = "";
      
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.main-cat-btn').forEach(el => el.classList.remove('active'));

      if (section === 'live') {
        document.getElementById('tabLive').classList.add('active');
        document.getElementById('btnLive').classList.add('active');
        fetchData('live');
      } else if (section === 'movies') {
        document.getElementById('tabMovies').classList.add('active');
        document.getElementById('btnMovies').classList.add('active');
        fetchData('movies');
      } else if (section === 'series') {
        document.getElementById('tabSeries').classList.add('active');
        document.getElementById('btnSeries').classList.add('active');
        fetchData('series');
      } else if (section === 'favorites') {
        document.getElementById('tabFav').classList.add('active');
        renderFavorites();
      }
    }

    // جلب البيانات من السيرفرات بشكل آمن وتدريجي
    async function fetchData(type) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '<div class="loader">جاري جلب المحتوى التدريجي...</div>';
      document.getElementById('subCatsBar').innerHTML = '';
      document.getElementById('loadMoreContainer').innerHTML = '';

      let catAction = type === 'movies' ? 'get_vod_categories' : (type === 'series' ? 'get_series_categories' : 'get_live_categories');
      let dataAction = type === 'movies' ? 'get_vod_streams' : (type === 'series' ? 'get_series' : 'get_live_streams');

      try {
        // نأخذ بيانات السيرفر الأول أو ندمج المتاحة
        const acc = currentActiveAccount;
        const [catsRes, dataRes] = await Promise.all([
          fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=${catAction}`),
          fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=${dataAction}`)
        ]);

        const cats = await catsRes.json();
        const data = await dataRes.json();

        categoriesList = Array.isArray(cats) ? cats : [];
        fullDataList = Array.isArray(data) ? data : [];
        
        renderSubCategories();
        filterByCategory('all');
      } catch (err) {
        grid.innerHTML = '<div class="loader">تعذر الاتصال بالسيرفر، جاري المحاولة بسيرفر آخر...</div>';
        tryAnotherAccount(type);
      }
    }

    async function tryAnotherAccount(type) {
      for(let i=1; i<accounts.length; i++) {
        currentActiveAccount = accounts[i];
        try {
          let catAction = type === 'movies' ? 'get_vod_categories' : (type === 'series' ? 'get_series_categories' : 'get_live_categories');
          let dataAction = type === 'movies' ? 'get_vod_streams' : (type === 'series' ? 'get_series' : 'get_live_streams');
          const acc = currentActiveAccount;
          const [catsRes, dataRes] = await Promise.all([
            fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=${catAction}`),
            fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=${dataAction}`)
          ]);
          categoriesList = await catsRes.json();
          fullDataList = await dataRes.json();
          renderSubCategories();
          filterByCategory('all');
          return;
        } catch(e) {}
      }
      document.getElementById('contentGrid').innerHTML = '<div class="loader">فشل الاتصال بكافة السيرفرات</div>';
    }

    function renderSubCategories() {
      const subBar = document.getElementById('subCatsBar');
      subBar.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = 'sub-cat-btn active';
      allBtn.innerText = 'الكل';
      allBtn.onclick = (e) => { setActiveSub(e.target); filterByCategory('all'); };
      subBar.appendChild(allBtn);

      categoriesList.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'sub-cat-btn';
        btn.innerText = cat.category_name;
        btn.onclick = (e) => { setActiveSub(e.target); filterByCategory(cat.category_id); };
        subBar.appendChild(btn);
      });
    }

    function setActiveSub(btn) {
      document.querySelectorAll('.sub-cat-btn').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
    }

    function filterByCategory(catId) {
      filteredList = catId === 'all' ? fullDataList : fullDataList.filter(i => i.category_id == catId);
      displayedCount = 0;
      document.getElementById('contentGrid').innerHTML = '';
      renderBatch();
    }

    function renderFavorites() {
      document.getElementById('subCatsBar').innerHTML = '';
      filteredList = favorites;
      displayedCount = 0;
      document.getElementById('contentGrid').innerHTML = '';
      renderBatch();
    }

    // التحميل التدريجي (Batch Rendering) لمنع تهنيج الجهاز
    function renderBatch() {
      const grid = document.getElementById('contentGrid');
      const loadMoreContainer = document.getElementById('loadMoreContainer');
      loadMoreContainer.innerHTML = '';

      if (!filteredList || filteredList.length === 0) {
        grid.innerHTML = '<div class="loader">لا توجد عناصر لعرضها</div>';
        return;
      }

      const batch = filteredList.slice(displayedCount, displayedCount + pageSize);
      batch.forEach(item => {
        const card = document.createElement('div');
        card.className = 'glass-card';
        const favorited = isFav(item);
        const id = item.stream_id || item.series_id;

        const favBtn = document.createElement('button');
        favBtn.className = `fav-card-btn ${favorited ? 'active' : ''}`;
        favBtn.innerHTML = '<i class="fas fa-heart"></i>';
        favBtn.onclick = (e) => toggleFav(e, item);
        card.appendChild(favBtn);

        if (currentSection === 'live' || (currentSection === 'favorites' && item.stream_icon && !item.container_extension && !item.num)) {
          const logo = item.stream_icon || '';
          const streamUrl = `${currentActiveAccount.host}/live/${currentActiveAccount.user}/${currentActiveAccount.pass}/${id}.m3u8`;
          card.onclick = () => openPlayer(streamUrl, true);

          card.innerHTML += `
            <span class="live-badge">مباشر</span>
            ${logo ? `<img src="${logo}" class="card-img" loading="lazy">` : `<div style="height:110px; display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--accent);"><i class="fas fa-tv"></i></div>`}
            <div class="card-title">${item.name}</div>
          `;
        } else if (currentSection === 'series' || (currentSection === 'favorites' && item.series_id)) {
          // المسلسلات: عرض الأجزاء والحلقات عند الضغط
          const poster = item.cover || item.stream_icon || 'https://via.placeholder.com/150/000/fff?text=Series';
          card.onclick = () => openSeriesDetails(id, item.name, poster);

          card.innerHTML += `
            <img src="${poster}" class="card-poster" loading="lazy">
            <div class="card-title">${item.name}</div>
          `;
        } else {
          // الأفلام
          const poster = item.stream_icon || 'https://via.placeholder.com/150/000/fff?text=Movie';
          const ext = item.container_extension || 'mp4';
          const mediaUrl = `${currentActiveAccount.host}/movie/${currentActiveAccount.user}/${currentActiveAccount.pass}/${id}.${ext}`;
          card.onclick = () => openPlayer(mediaUrl, false);

          card.innerHTML += `
            <img src="${poster}" class="card-poster" loading="lazy">
            <div class="card-title">${item.name}</div>
          `;
        }

        grid.appendChild(card);
      });

      displayedCount += batch.length;

      // زر تحميل المزيد إذا بقي عناصر (لتخفيف العبء عن الجهاز)
      if (displayedCount < filteredList.length) {
        const btn = document.createElement('div');
        btn.className = 'load-more-btn';
        btn.innerText = 'تحميل المزيد...';
        btn.onclick = renderBatch;
        loadMoreContainer.appendChild(btn);
      }
    }

    // جلب تفاصيل المسلسل (الأجزاء والحلقات)
    async function openSeriesDetails(seriesId, title, defaultPoster) {
      const modal = document.getElementById('seriesModal');
      modal.style.display = 'flex';
      document.getElementById('seriesModalTitle').innerText = title;
      document.getElementById('seriesModalPoster').src = defaultPoster;
      document.getElementById('seriesModalDesc').innerText = 'جاري جلب تفاصيل الأجزاء والحلقات...';
      document.getElementById('seasonTabs').innerHTML = '';
      document.getElementById('episodesList').innerHTML = '';

      const acc = currentActiveAccount;
      try {
        const res = await fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=get_series_info&series_id=${seriesId}`);
        const data = await res.json();

        if (data && data.info) {
          document.getElementById('seriesModalDesc').innerText = data.info.plot || 'لا يوجد وصف متاح.';
          if (data.info.cover) document.getElementById('seriesModalPoster').src = data.info.cover;
        }

        if (data && data.episodes) {
          window.seriesEpisodesData = data.episodes;
          renderSeasons(Object.keys(data.episodes));
        }
      } catch (e) {
        document.getElementById('seriesModalDesc').innerText = 'تعذر تحميل تفاصيل الحلقات.';
      }
    }

    function renderSeasons(seasonsKeys) {
      const tabsBar = document.getElementById('seasonTabs');
      tabsBar.innerHTML = '';
      
      seasonsKeys.forEach((seasonNum, index) => {
        const tab = document.createElement('button');
        tab.className = `season-tab ${index === 0 ? 'active' : ''}`;
        tab.innerText = `الموسم ${seasonNum}`;
        tab.onclick = (e) => {
          document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
          e.target.classList.add('active');
          renderEpisodes(seasonNum);
        };
        tabsBar.appendChild(tab);
      });

      if (seasonsKeys.length > 0) {
        renderEpisodes(seasonsKeys[0]);
      }
    }

    function renderEpisodes(seasonNum) {
      const listContainer = document.getElementById('episodesList');
      listContainer.innerHTML = '';
      const eps = window.seriesEpisodesData[seasonNum] || [];

      eps.forEach(ep => {
        const item = document.createElement('div');
        item.className = 'episode-item';
        const epImg = ep.info?.movie_image || ep.cover_big || 'https://via.placeholder.com/80x50/111/fff?text=Ep';
        const ext = ep.container_extension || 'mp4';
        const epUrl = `${currentActiveAccount.host}/series/${currentActiveAccount.user}/${currentActiveAccount.pass}/${ep.id}.${ext}`;

        item.onclick = () => {
          closeSeriesModal();
          openPlayer(epUrl, false);
        };

        item.innerHTML = `
          <img src="${epImg}" class="episode-img" loading="lazy">
          <div class="episode-info">
            <h4>الحلقة ${ep.episode_num}: ${ep.title || ''}</h4>
            <p>اضغط للتشغيل الآن</p>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function closeSeriesModal() {
      document.getElementById('seriesModal').style.display = 'none';
    }

    function isFav(item) {
      const id = item.stream_id || item.series_id;
      return favorites.some(f => (f.stream_id || f.series_id) == id);
    }

    function toggleFav(event, item) {
      event.stopPropagation();
      const id = item.stream_id || item.series_id;
      const index = favorites.findIndex(f => (f.series_id || f.stream_id) == id);
      if (index > -1) {
        favorites.splice(index, 1);
      } else {
        favorites.push(item);
      }
      localStorage.setItem('ahmed_tv_favs', JSON.stringify(favorites));
      event.currentTarget.classList.toggle('active');
      if (currentSection === 'favorites') renderFavorites();
    }

    function openPlayer(url, isHlsStream) {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('videoPlayer');
      modal.style.display = 'flex';

      if (isHlsStream && Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); });
      } else {
        video.src = url;
        video.play();
      }
    }

    function closePlayer() {
      const modal = document.getElementById('videoModal');
      const video = document.getElementById('videoPlayer');
      video.pause();
      video.src = "";
      if (hlsInstance) hlsInstance.destroy();
      modal.style.display = 'none';
    }

    function handleSearch(keyword) {
      const query = keyword.trim().toLowerCase();
      const source = currentSection === 'favorites' ? favorites : fullDataList;
      filteredList = source.filter(i => (i.name || "").toLowerCase().includes(query));
      displayedCount = 0;
      document.getElementById('contentGrid').innerHTML = '';
      renderBatch();
    }
  </script>
</body>
</html>
