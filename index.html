<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AHMED TV | Full Pro Edition</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --ios-blur: blur(35px);
      --ios-bg: rgba(255, 255, 255, 0.08);
      --ios-border: rgba(255, 255, 255, 0.15);
      --accent: #007aff;
      --danger: #ff3b30;
      --player-bg: #0a111a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      font-family: 'Readex Pro', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #1a2a3a 0%, #000 100%);
      overflow-x: hidden;
      padding-bottom: 120px;
    }

    /* الهيدر والقوائم */
    header { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(0, 0, 0, 0.65); backdrop-filter: var(--ios-blur); padding: 12px 20px 15px; border-bottom: 0.5px solid var(--ios-border); }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .menu-btn { background: var(--ios-bg); border: 0.5px solid var(--ios-border); width: 40px; height: 40px; border-radius: 12px; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .brand-container { text-align: center; flex: 1; }
    .brand-name { font-size: 22px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
    .brand-name span { color: var(--accent); }
    .search-container { display: flex; align-items: center; background: rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 8px 15px; border: 0.5px solid var(--ios-border); }
    .search-container input { background: none; border: none; color: white; width: 100%; outline: none; font-family: inherit; font-size: 14px; margin-right: 10px; }

    .main-cats { display: flex; gap: 8px; padding: 130px 20px 10px; max-width: 600px; margin: 0 auto; }
    .main-cat-btn { flex: 1; padding: 10px; background: var(--ios-bg); border: 0.5px solid var(--ios-border); border-radius: 14px; color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; font-family: inherit; transition: 0.3s; }
    .main-cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); }

    .sub-cats { display: flex; gap: 8px; padding: 0 20px 15px; overflow-x: auto; white-space: nowrap; max-width: 600px; margin: 0 auto; }
    .sub-cats::-webkit-scrollbar { display: none; }
    .sub-cat-btn { padding: 6px 14px; background: var(--ios-bg); border: 0.5px solid var(--ios-border); border-radius: 12px; color: rgba(255,255,255,0.6); font-size: 12px; cursor: pointer; font-family: inherit; transition: 0.2s; }
    .sub-cat-btn.active { background: rgba(255,255,255,0.2); color: #fff; border-color: #fff; font-weight: 600; }

    .app-container { padding: 0 20px; max-width: 600px; margin: 0 auto; }
    .content-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .glass-card { background: var(--ios-bg); backdrop-filter: var(--ios-blur); border: 1px solid var(--ios-border); border-radius: 22px; padding: 12px; text-align: center; position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: all 0.3s ease; text-decoration: none; color: white; }
    .glass-card:active { transform: scale(0.96); background: rgba(255,255,255,0.15); }
    .card-img { width: 100%; height: 110px; object-fit: contain; border-radius: 14px; background: rgba(0,0,0,0.2); padding: 8px; margin-bottom: 10px; }
    .card-poster { width: 100%; height: 160px; object-fit: cover; border-radius: 14px; margin-bottom: 10px; }
    .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .live-badge { position: absolute; top: 10px; right: 10px; background: var(--danger); color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
    .fav-card-btn { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 0.5px solid var(--ios-border); width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: 0.2s; }
    .fav-card-btn.active { color: var(--danger); background: rgba(255, 59, 48, 0.15); border-color: var(--danger); }

    /* القائمة الجانبية */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2500; display: none; backdrop-filter: blur(5px); }
    .side-drawer { position: fixed; top: 0; right: -280px; width: 280px; height: 100vh; background: rgba(18, 18, 20, 0.95); backdrop-filter: var(--ios-blur); z-index: 3000; border-left: 1px solid var(--ios-border); transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); display: flex; flex-direction: column; }
    .side-drawer.open { right: 0; }
    .drawer-header { padding: 35px 20px; background: linear-gradient(135deg, rgba(0,122,255,0.3), transparent); text-align: center; border-bottom: 0.5px solid var(--ios-border); }
    .drawer-avatar { width: 65px; height: 65px; background: var(--ios-bg); border: 1px solid var(--ios-border); border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--accent); }
    .drawer-menu-list { padding: 15px 0; flex: 1; }
    .drawer-item { padding: 15px 22px; display: flex; align-items: center; gap: 15px; color: #fff; font-size: 14px; text-decoration: none; cursor: pointer; transition: 0.2s; border-right: 3px solid transparent; }
    .drawer-item:active { background: rgba(255,255,255,0.06); color: var(--accent); border-right-color: var(--accent); }
    .drawer-item i { font-size: 18px; width: 24px; text-align: center; color: var(--accent); }

    /* تفاصيل المسلسلات - التمرير الأفقي للحلقات */
    #seriesModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: var(--ios-blur); z-index: 4000; display: none; flex-direction: column; padding: 20px; }
    .series-header { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
    .series-poster { width: 100px; height: 140px; object-fit: cover; border-radius: 12px; border: 1px solid var(--ios-border); }
    .season-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .season-tabs::-webkit-scrollbar { display: none; }
    .season-tab { padding: 8px 16px; background: var(--ios-bg); border: 1px solid var(--ios-border); border-radius: 10px; color: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .season-tab.active { background: var(--accent); border-color: var(--accent); }
    
    /* التعديل الجديد للحلقات بجانب بعض */
    .episodes-list { display: flex; flex-direction: row; gap: 12px; overflow-x: auto; padding-bottom: 20px; }
    .episodes-list::-webkit-scrollbar { display: none; }
    .episode-item { display: flex; flex-direction: column; min-width: 140px; background: var(--ios-bg); border: 1px solid var(--ios-border); padding: 10px; border-radius: 14px; cursor: pointer; }
    .episode-img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; background: #111; margin-bottom: 8px; }
    .episode-info h4 { font-size: 12px; text-align: center; white-space: normal; }

    /* المشغل المخصص - مطابق للصورة والمطلوب */
    #videoModal { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; width: 100vw; height: 100vh; flex-direction: column; }
    
    .player-wrapper { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; position: absolute; }
    
    .player-grid-overlay { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 10% 100%; pointer-events: none; z-index: 1; }

    .player-ui { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: 25px; background: rgba(0, 0, 0, 0.5); transition: opacity 0.3s ease; }
    .player-ui.hidden { opacity: 0; pointer-events: none; }

    /* أدوات التحكم العلوية */
    .top-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .live-indicator { background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
    .live-indicator .dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    
    .player-title { color: #fff; font-size: 16px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.5); flex: 1; text-align: center; direction: ltr; }
    .btn-back-player { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }

    /* أدوات التحكم الوسطى (أزرار 10 ثواني) */
    .center-controls { display: flex; justify-content: center; align-items: center; gap: 50px; }
    .btn-skip { background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; transition: 0.2s; opacity: 0.8; }
    .btn-skip:active { opacity: 1; transform: scale(0.85); }
    .btn-play-pause { width: 75px; height: 75px; border-radius: 50%; background: rgba(0, 122, 255, 0.25); border: 2px solid var(--accent); color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); transition: 0.2s; }
    .btn-play-pause:active { transform: scale(0.9); background: rgba(0, 122, 255, 0.5); }

    /* أدوات التحكم السفلية - شريط السحب */
    .bottom-controls { display: flex; align-items: center; gap: 15px; width: 100%; direction: ltr; padding-bottom: 10px; }
    .btn-bottom { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; opacity: 0.8; }
    
    .progress-container { flex: 1; display: flex; align-items: center; position: relative; height: 30px; cursor: pointer; touch-action: none; }
    .progress-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.25); border-radius: 3px; position: relative; pointer-events: none; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; position: absolute; left: 0; top: 0; }
    .progress-thumb { width: 16px; height: 16px; background: #fff; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%) translateX(50%); right: 100%; box-shadow: 0 0 8px rgba(0,0,0,0.6); pointer-events: none; }
    
    .time-display { color: #fff; font-size: 13px; font-weight: 600; min-width: 90px; text-align: right; }

    /* واجهة الإعلان المنبثق داخل المشغل */
    #adOverlay { position: absolute; inset: 0; background: #000; z-index: 20; display: none; flex-direction: column; }
    .ad-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(0,0,0,0.8); position: absolute; top: 0; width: 100%; z-index: 21; }
    .ad-badge { background: #f1c40f; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .ad-timer { color: #fff; font-size: 14px; }
    .ad-iframe { width: 100%; height: 100%; border: none; background: #111; }

    /* الشريط السفلي للتطبيق */
    .tab-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 450px; height: 65px; background: rgba(25, 25, 25, 0.75); backdrop-filter: var(--ios-blur); border-radius: 32px; border: 1.5px solid var(--ios-border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .tab-item { color: rgba(255,255,255,0.4); text-decoration: none; text-align: center; font-size: 10px; cursor: pointer; flex: 1; transition: 0.2s; }
    .tab-item i { font-size: 20px; display: block; margin-bottom: 3px; }
    .tab-item.active { color: var(--accent); font-weight: 600; }
    .loader { text-align: center; grid-column: span 2; padding: 40px; color: rgba(255,255,255,0.4); font-size: 14px; }
    .load-more-btn { grid-column: span 2; padding: 12px; background: var(--ios-bg); border: 1px solid var(--ios-border); border-radius: 14px; color: #fff; font-weight: 600; cursor: pointer; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
  <div class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <div class="drawer-avatar"><i class="fas fa-tv"></i></div>
      <h3 style="font-size: 18px;">AHMED TV</h3>
      <p style="font-size: 11px; opacity: 0.6; margin-top: 4px;">متعدد السيرفرات الاحترافي</p>
    </div>
    <div class="drawer-menu-list">
      <a href="https://t.me/AHMEDTVGY" target="_blank" class="drawer-item"><i class="fab fa-telegram"></i> قناة التليجرام</a>
      <div class="drawer-item" onclick="toggleDrawer(); switchTab('favorites')"><i class="fas fa-heart" style="color: var(--danger);"></i> المفضلة</div>
    </div>
  </div>

  <div id="seriesModal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3 id="seriesModalTitle" style="font-size:16px;">التفاصيل</h3>
      <button onclick="closeSeriesModal()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="series-header">
      <img id="seriesModalPoster" class="series-poster" src="" alt="">
      <div><p id="seriesModalDesc" style="font-size:12px; opacity:0.7; max-height:90px; overflow-y:auto;"></p></div>
    </div>
    <div class="season-tabs" id="seasonTabs"></div>
    <div class="episodes-list" id="episodesList"></div>
  </div>

  <!-- المشغل المخصص الجديد -->
  <div id="videoModal">
    <div class="player-wrapper" id="playerWrapper" onclick="toggleControls()">
      <video id="videoPlayer" playsinline></video>
      <div class="player-grid-overlay"></div>
      
      <!-- واجهة الإعلان 7 ثواني -->
      <div id="adOverlay">
        <div class="ad-header">
          <span class="ad-badge">إعلان</span>
          <span class="ad-timer">سيبدأ الفيديو بعد <span id="adSeconds">7</span> ثواني</span>
        </div>
        <iframe id="adIframe" class="ad-iframe" src="about:blank"></iframe>
      </div>

      <!-- أدوات التحكم -->
      <div class="player-ui" id="playerUI">
        <div class="top-controls">
          <div class="live-indicator" id="liveIndicator"><div class="dot"></div> LIVE</div>
          <div class="player-title" id="playerTitle">اسم القناة أو الفيلم</div>
          <button class="btn-back-player" onclick="event.stopPropagation(); closePlayer()"><i class="fas fa-chevron-right"></i></button>
        </div>
        
        <div class="center-controls">
          <button class="btn-skip" onclick="event.stopPropagation(); skipVideo(-10)"><i class="fas fa-backward"></i></button>
          <button class="btn-play-pause" id="playPauseBtn" onclick="event.stopPropagation(); togglePlayPause()"><i class="fas fa-pause"></i></button>
          <button class="btn-skip" onclick="event.stopPropagation(); skipVideo(10)"><i class="fas fa-forward"></i></button>
        </div>
        
        <div class="bottom-controls">
          <button class="btn-bottom" onclick="event.stopPropagation(); toggleFullscreen()"><i class="fas fa-expand"></i></button>
          <button class="btn-bottom" onclick="event.stopPropagation(); toggleMute()"><i class="fas fa-volume-up" id="muteIcon"></i></button>
          
          <div class="progress-container" id="progressContainer">
            <div class="progress-bg">
              <div class="progress-fill" id="progressFill"></div>
              <div class="progress-thumb" id="progressThumb"></div>
            </div>
          </div>
          
          <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
        </div>
      </div>
    </div>
  </div>

  <header>
    <div class="header-top">
      <button class="menu-btn" onclick="toggleDrawer()"><i class="fas fa-bars"></i></button>
      <div class="brand-container"><div class="brand-name">AHMED <span>TV</span></div></div>
      <div style="width: 40px;"></div>
    </div>
    <div class="search-container">
      <i class="fas fa-search" style="color: rgba(255,255,255,0.4);"></i>
      <input type="text" id="searchInput" placeholder="ابحث عن قناة أو فيلم..." oninput="handleSearch(this.value)">
    </div>
  </header>

  <div class="main-cats">
    <button class="main-cat-btn active" id="btnLive" onclick="switchTab('live')"><i class="fas fa-broadcast-tower"></i> القنوات</button>
    <button class="main-cat-btn" id="btnMovies" onclick="switchTab('movies')"><i class="fas fa-film"></i> الأفلام</button>
    <button class="main-cat-btn" id="btnSeries" onclick="switchTab('series')"><i class="fas fa-th-large"></i> المسلسلات</button>
  </div>
  <div class="sub-cats" id="subCatsBar"></div>

  <main class="app-container">
    <div class="content-grid" id="contentGrid"></div>
    <div id="loadMoreContainer"></div>
  </main>

  <nav class="tab-bar">
    <a class="tab-item active" id="tabLive" onclick="switchTab('live')"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a class="tab-item" id="tabMovies" onclick="switchTab('movies')"><i class="fas fa-film"></i><span>الأفلام</span></a>
    <a class="tab-item" id="tabSeries" onclick="switchTab('series')"><i class="fas fa-tv"></i><span>المسلسلات</span></a>
    <a class="tab-item" id="tabFav" onclick="switchTab('favorites')"><i class="fas fa-heart"></i><span>المفضلة</span></a>
  </nav>

  <script>
    const accounts = [
      { host: "http://vipxtv.net:80", user: "yousrybasha90", pass: "828274919478182" },
      { host: "http://sansatplus.net:88", user: "02077332242203", pass: "qBN8x0pwUJ4e6AA" },
      { host: "http://legendking.net:8080", user: "8c%3Aea%3A48%3A86%3Aa1%3A21", pass: "EFQVuf6xa2SwdkT" }
    ];

    let currentSection = 'live', categoriesList = [], fullDataList = [], filteredList = [], displayedCount = 0;
    const pageSize = 20;
    // تحميل المفضلة 
    let favorites = JSON.parse(localStorage.getItem('ahmed_tv_favs') || '[]');
    let currentActiveAccount = accounts[0];

    window.onload = () => { switchTab('live'); };

    function toggleDrawer() {
      const drawer = document.getElementById('sideDrawer');
      drawer.classList.toggle('open');
      document.getElementById('drawerOverlay').style.display = drawer.classList.contains('open') ? 'block' : 'none';
    }

    function switchTab(section) {
      currentSection = section;
      document.getElementById('searchInput').value = "";
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.main-cat-btn').forEach(el => el.classList.remove('active'));

      if(section !== 'favorites') {
        document.getElementById('tab' + section.charAt(0).toUpperCase() + section.slice(1)).classList.add('active');
        document.getElementById('btn' + section.charAt(0).toUpperCase() + section.slice(1)).classList.add('active');
        fetchData(section);
      } else {
        document.getElementById('tabFav').classList.add('active');
        renderFavorites();
      }
    }

    async function fetchData(type) {
      document.getElementById('contentGrid').innerHTML = '<div class="loader">جاري التحميل...</div>';
      document.getElementById('subCatsBar').innerHTML = '';
      document.getElementById('loadMoreContainer').innerHTML = '';
      let catAction = type === 'movies' ? 'get_vod_categories' : (type === 'series' ? 'get_series_categories' : 'get_live_categories');
      let dataAction = type === 'movies' ? 'get_vod_streams' : (type === 'series' ? 'get_series' : 'get_live_streams');
      
      try {
        const acc = currentActiveAccount;
        const [catsRes, dataRes] = await Promise.all([
          fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=${catAction}`),
          fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=${dataAction}`)
        ]);
        categoriesList = await catsRes.json();
        fullDataList = await dataRes.json();
        renderSubCategories();
        filterByCategory('all');
      } catch (err) {
        document.getElementById('contentGrid').innerHTML = '<div class="loader">خطأ في الاتصال بالسيرفر</div>';
      }
    }

    function renderSubCategories() {
      const subBar = document.getElementById('subCatsBar');
      subBar.innerHTML = '<button class="sub-cat-btn active" onclick="setActiveSub(this); filterByCategory(\'all\')">الكل</button>';
      categoriesList.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'sub-cat-btn';
        btn.innerText = cat.category_name;
        btn.onclick = (e) => { setActiveSub(e.target); filterByCategory(cat.category_id); };
        subBar.appendChild(btn);
      });
    }

    function setActiveSub(btn) {
      document.querySelectorAll('.sub-cat-btn').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
    }

    function filterByCategory(catId) {
      filteredList = catId === 'all' ? fullDataList : fullDataList.filter(i => i.category_id == catId);
      displayedCount = 0; document.getElementById('contentGrid').innerHTML = '';
      renderBatch();
    }

    function renderFavorites() {
      document.getElementById('subCatsBar').innerHTML = '';
      filteredList = favorites; displayedCount = 0;
      document.getElementById('contentGrid').innerHTML = '';
      renderBatch();
    }

    function renderBatch() {
      const grid = document.getElementById('contentGrid');
      const loadMoreContainer = document.getElementById('loadMoreContainer');
      loadMoreContainer.innerHTML = '';
      if (!filteredList || filteredList.length === 0) { grid.innerHTML = '<div class="loader">لا توجد عناصر</div>'; return; }

      const batch = filteredList.slice(displayedCount, displayedCount + pageSize);
      batch.forEach(item => {
        const card = document.createElement('div');
        card.className = 'glass-card';
        const id = item.stream_id || item.series_id;
        
        // تعديل زر المفضلة لمنع تداخل النقرات
        const favBtn = document.createElement('button');
        favBtn.className = `fav-card-btn ${isFav(item) ? 'active' : ''}`;
        favBtn.innerHTML = '<i class="fas fa-heart"></i>';
        favBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation(); // يمنع فتح الفيديو عند ضغط القلب
          toggleFav(favBtn, item);
        };
        card.appendChild(favBtn);

        const isLive = currentSection === 'live' || (currentSection === 'favorites' && item.stream_icon && !item.container_extension && !item.num);
        const isSeries = currentSection === 'series' || (currentSection === 'favorites' && item.series_id);

        if (isLive) {
          const streamUrl = `${currentActiveAccount.host}/live/${currentActiveAccount.user}/${currentActiveAccount.pass}/${id}.m3u8`;
          card.onclick = () => showAdAndPlay(streamUrl, true, item.name, id);
          card.innerHTML += `<span class="live-badge">مباشر</span><img src="${item.stream_icon || ''}" class="card-img" onerror="this.style.display='none'"><div class="card-title">${item.name}</div>`;
        } else if (isSeries) {
          card.onclick = () => openSeriesDetails(id, item.name, item.cover || item.stream_icon);
          card.innerHTML += `<img src="${item.cover || item.stream_icon}" class="card-poster" onerror="this.style.display='none'"><div class="card-title">${item.name}</div>`;
        } else {
          const mediaUrl = `${currentActiveAccount.host}/movie/${currentActiveAccount.user}/${currentActiveAccount.pass}/${id}.${item.container_extension || 'mp4'}`;
          card.onclick = () => showAdAndPlay(mediaUrl, false, item.name, id);
          card.innerHTML += `<img src="${item.stream_icon}" class="card-poster" onerror="this.style.display='none'"><div class="card-title">${item.name}</div>`;
        }
        grid.appendChild(card);
      });
      displayedCount += batch.length;
      if (displayedCount < filteredList.length) {
        const btn = document.createElement('div'); btn.className = 'load-more-btn';
        btn.innerText = 'تحميل المزيد...'; btn.onclick = renderBatch;
        loadMoreContainer.appendChild(btn);
      }
    }

    function isFav(item) {
      const id = item.stream_id || item.series_id;
      return favorites.some(f => (f.stream_id || f.series_id) == id);
    }
    
    function toggleFav(btnElement, item) {
      const id = item.stream_id || item.series_id;
      const index = favorites.findIndex(f => (f.series_id || f.stream_id) == id);
      if (index > -1) {
        favorites.splice(index, 1);
        btnElement.classList.remove('active');
      } else {
        favorites.push(item);
        btnElement.classList.add('active');
      }
      localStorage.setItem('ahmed_tv_favs', JSON.stringify(favorites));
      if (currentSection === 'favorites') renderFavorites();
    }

    async function openSeriesDetails(id, title, poster) {
      document.getElementById('seriesModal').style.display = 'flex';
      document.getElementById('seriesModalTitle').innerText = title;
      document.getElementById('seriesModalPoster').src = poster;
      document.getElementById('seriesModalDesc').innerText = 'جاري التحميل...';
      const acc = currentActiveAccount;
      const res = await fetch(`${acc.host}/player_api.php?username=${acc.user}&password=${acc.pass}&action=get_series_info&series_id=${id}`);
      const data = await res.json();
      document.getElementById('seriesModalDesc').innerText = data.info?.plot || '';
      
      const tabsBar = document.getElementById('seasonTabs'); tabsBar.innerHTML = '';
      const epsList = document.getElementById('episodesList'); epsList.innerHTML = '';
      
      Object.keys(data.episodes).forEach((s, idx) => {
        const tab = document.createElement('button'); tab.className = `season-tab ${idx===0?'active':''}`;
        tab.innerText = `الموسم ${s}`;
        tab.onclick = () => { document.querySelectorAll('.season-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); renderEps(data.episodes[s], title); };
        tabsBar.appendChild(tab);
      });
      if(Object.keys(data.episodes).length > 0) renderEps(data.episodes[Object.keys(data.episodes)[0]], title);
    }

    function renderEps(eps, sTitle) {
      const epsList = document.getElementById('episodesList'); epsList.innerHTML = '';
      eps.forEach(ep => {
        const item = document.createElement('div'); item.className = 'episode-item';
        const url = `${currentActiveAccount.host}/series/${currentActiveAccount.user}/${currentActiveAccount.pass}/${ep.id}.${ep.container_extension || 'mp4'}`;
        // تمرير معرف الحلقة للتمكن من حفظ تقدم المشاهدة لها بشكل مستقل
        item.onclick = () => { closeSeriesModal(); showAdAndPlay(url, false, `الحلقة ${ep.episode_num} - ${sTitle}`, 'ep_' + ep.id); };
        item.innerHTML = `
          <img src="${ep.info.movie_image || ''}" class="episode-img" onerror="this.style.display='none'">
          <div class="episode-info"><h4>الحلقة ${ep.episode_num}: ${ep.title}</h4></div>`;
        epsList.appendChild(item);
      });
    }
    
    function closeSeriesModal() { document.getElementById('seriesModal').style.display = 'none'; }
    
    function handleSearch(keyword) {
      const q = keyword.trim().toLowerCase();
      const src = currentSection === 'favorites' ? favorites : fullDataList;
      filteredList = src.filter(i => (i.name || "").toLowerCase().includes(q));
      displayedCount = 0; document.getElementById('contentGrid').innerHTML = ''; renderBatch();
    }

    /* ---------------------------------------------------
       برمجة المشغل المخصص وحفظ تقدم المشاهدة وشريط التمرير
    --------------------------------------------------- */
    let hlsInstance = null;
    const video = document.getElementById('videoPlayer');
    const playerUI = document.getElementById('playerUI');
    let uiTimeout;
    let isLiveStream = false;
    let currentMediaId = null;

    function showAdAndPlay(url, isLive, title, id) {
      document.getElementById('videoModal').style.display = 'flex';
      document.getElementById('playerTitle').innerText = title;
      isLiveStream = isLive;
      currentMediaId = id; // حفظ المعرف للتمكن من إكمال المشاهدة
      
      if(isLive) {
        document.getElementById('liveIndicator').style.display = 'flex';
        document.getElementById('timeDisplay').innerText = 'مباشر';
        document.getElementById('progressContainer').style.opacity = '0.5';
      } else {
        document.getElementById('liveIndicator').style.display = 'none';
        document.getElementById('progressContainer').style.opacity = '1';
      }

      const adOverlay = document.getElementById('adOverlay');
      const adIframe = document.getElementById('adIframe');
      const adSecondsSpan = document.getElementById('adSeconds');
      
      adIframe.src = "https://omg10.com/4/8447429"; 
      adOverlay.style.display = 'flex';
      playerUI.style.display = 'none';
      video.style.display = 'none'; 
      
      let timeLeft = 7;
      adSecondsSpan.innerText = timeLeft;
      
      const countdown = setInterval(() => {
        timeLeft--;
        adSecondsSpan.innerText = timeLeft;
        if(timeLeft <= 0) {
          clearInterval(countdown);
          adOverlay.style.display = 'none';
          adIframe.src = "about:blank"; 
          playerUI.style.display = 'flex';
          video.style.display = 'block';
          startVideo(url, isLive);
        }
      }, 1000);
    }

    function startVideo(url, isLive) {
      if (isLive && Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls(); 
        hlsInstance.loadSource(url); 
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else {
        video.src = url; 
        
        // استرجاع الدقيقة التي توقف عندها (Resume)
        if (!isLiveStream && currentMediaId) {
          const savedTime = localStorage.getItem('ahmedtv_resume_' + currentMediaId);
          if (savedTime && !isNaN(savedTime)) {
            video.currentTime = parseFloat(savedTime);
          }
        }
        video.play();
      }
      resetUITimeout();
    }

    function closePlayer() {
      // حفظ الوقت الحالي قبل الخروج إذا كان فيلماً أو مسلسلاً
      if (!isLiveStream && currentMediaId && video.currentTime > 5) {
        localStorage.setItem('ahmedtv_resume_' + currentMediaId, video.currentTime);
      }
      
      video.pause(); 
      video.src = "";
      if (hlsInstance) hlsInstance.destroy();
      document.getElementById('videoModal').style.display = 'none';
      if(document.fullscreenElement) document.exitFullscreen();
    }

    function toggleControls() {
      playerUI.classList.toggle('hidden');
      if(!playerUI.classList.contains('hidden')) resetUITimeout();
    }

    function resetUITimeout() {
      clearTimeout(uiTimeout);
      uiTimeout = setTimeout(() => { playerUI.classList.add('hidden'); }, 3000);
    }

    video.addEventListener('mousemove', resetUITimeout);
    video.addEventListener('touchstart', resetUITimeout);

    // أزرار التحكم 10 ثواني تعمل الآن بشكل سليم
    function togglePlayPause() {
      const icon = document.querySelector('#playPauseBtn i');
      if (video.paused) { video.play(); icon.className = 'fas fa-pause'; } 
      else { video.pause(); icon.className = 'fas fa-play'; }
      resetUITimeout();
    }

    function skipVideo(seconds) {
      if(!isLiveStream && video.duration) {
        video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + seconds));
      }
      resetUITimeout();
    }

    function toggleMute() {
      video.muted = !video.muted;
      document.getElementById('muteIcon').className = video.muted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
      resetUITimeout();
    }

    function toggleFullscreen() {
      const modal = document.getElementById('videoModal');
      if (!document.fullscreenElement) {
        if(modal.requestFullscreen) modal.requestFullscreen();
        else if(modal.webkitRequestFullscreen) modal.webkitRequestFullscreen();
      } else {
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
      resetUITimeout();
    }

    // تحديث شريط التقدم وحفظ التقدم تلقائياً
    video.addEventListener('timeupdate', () => {
      if (isLiveStream || !video.duration || isDraggingProgress) return;
      
      const percent = (video.currentTime / video.duration) * 100;
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('progressThumb').style.right = (100 - percent) + '%';
      
      const formatTime = (time) => {
        let mins = Math.floor(time / 60); let secs = Math.floor(time % 60);
        let hrs = Math.floor(mins / 60); mins = mins % 60;
        if(hrs > 0) return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };
      document.getElementById('timeDisplay').innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      
      // حفظ التقدم بانتظام (كل 5 ثواني مثلاً)
      if (currentMediaId && Math.floor(video.currentTime) % 5 === 0 && video.currentTime > 5) {
        localStorage.setItem('ahmedtv_resume_' + currentMediaId, video.currentTime);
      }
    });

    video.addEventListener('play', () => document.querySelector('#playPauseBtn i').className = 'fas fa-pause');
    video.addEventListener('pause', () => document.querySelector('#playPauseBtn i').className = 'fas fa-play');
    video.addEventListener('ended', () => {
      // تنظيف الذاكرة عند الانتهاء
      if(currentMediaId) localStorage.removeItem('ahmedtv_resume_' + currentMediaId);
    });

    /* ---------------------------------------------------
       برمجة سحب شريط التقدم بالإصبع
    --------------------------------------------------- */
    const progressContainer = document.getElementById('progressContainer');
    let isDraggingProgress = false;

    function updateProgressFromEvent(e) {
      if (isLiveStream || !video.duration) return;
      const rect = progressContainer.getBoundingClientRect();
      const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      let pos = (clientX - rect.left) / rect.width;
      pos = Math.max(0, Math.min(1, pos));
      
      video.currentTime = pos * video.duration;
      
      const percent = pos * 100;
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('progressThumb').style.right = (100 - percent) + '%';
    }

    // للمس عبر الموبايل (Touch)
    progressContainer.addEventListener('touchstart', (e) => {
      if(isLiveStream) return;
      isDraggingProgress = true;
      resetUITimeout();
      updateProgressFromEvent(e);
    }, {passive: true});

    progressContainer.addEventListener('touchmove', (e) => {
      if(!isDraggingProgress) return;
      e.preventDefault(); // لمنع تحرك الشاشة أثناء سحب الشريط
      resetUITimeout();
      updateProgressFromEvent(e);
    }, {passive: false});

    progressContainer.addEventListener('touchend', () => {
      isDraggingProgress = false;
    });

    // للماوس عبر الكمبيوتر
    progressContainer.addEventListener('mousedown', (e) => {
      if(isLiveStream) return;
      isDraggingProgress = true;
      resetUITimeout();
      updateProgressFromEvent(e);
    });

    document.addEventListener('mousemove', (e) => {
      if(isDraggingProgress) {
        resetUITimeout();
        updateProgressFromEvent(e);
      }
    });

    document.addEventListener('mouseup', () => {
      isDraggingProgress = false;
    });

  </script>
</body>
</html>
