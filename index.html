<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AHMED TV</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body { background-color: #0b1120; color: #ffffff; padding-bottom: 75px; overflow-x: hidden; }

    #appLaunchAdOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #020617; z-index: 99999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    #appLaunchAdFrame { width: 100%; height: 100%; border: none; pointer-events: auto; }
    .start-skip-btn {
      position: absolute; bottom: 30px; left: 20px;
      background: rgba(15, 23, 42, 0.8); color: #64748b;
      border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 22px;
      border-radius: 25px; font-size: 13px; font-weight: bold;
      cursor: not-allowed; transition: all 0.3s ease; z-index: 100000;
    }
    .start-skip-btn.active {
      background: rgba(2, 132, 199, 0.95); color: #ffffff;
      border-color: #38bdf8; cursor: pointer;
    }

    .header { padding: 20px 16px 10px; display: flex; justify-content: space-between; align-items: center; }
    .app-title { font-size: 22px; font-weight: bold; }
    .user-tag { font-size: 12px; color: #94a3b8; }
    .status-badge { background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 4px 12px; border-radius: 20px; font-size: 12px; }

    .search-box { margin: 10px 16px; position: relative; }
    .search-box input { width: 100%; padding: 12px 16px 12px 40px; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 25px; color: #fff; font-size: 14px; outline: none; }
    .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #64748b; }

    .main-categories { display: flex; gap: 10px; padding: 5px 16px 10px; }
    .main-cat-btn { flex: 1; padding: 10px; background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; color: #94a3b8; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
    .main-cat-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    .sub-categories { display: flex; gap: 8px; padding: 5px 16px 10px; overflow-x: auto; white-space: nowrap; }
    .sub-categories::-webkit-scrollbar { display: none; }
    .sub-cat-btn { padding: 6px 14px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; color: #94a3b8; font-size: 12px; cursor: pointer; }
    .sub-cat-btn.active { background: #334155; color: #38bdf8; border-color: #38bdf8; }

    .content-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
    .media-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.8)); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; overflow: hidden; text-align: center; position: relative; cursor: pointer; display: flex; flex-direction: column; }
    .media-poster { width: 100%; height: 145px; object-fit: cover; background-color: #1e293b; }
    .channel-logo { width: 100%; height: 100px; object-fit: contain; padding: 10px; background-color: rgba(15, 23, 42, 0.5); }
    .live-badge { position: absolute; top: 6px; right: 6px; background: rgba(239, 68, 68, 0.9); color: #ffffff; font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .media-title { font-size: 11px; font-weight: 600; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 8px; margin-top: auto; }

    .loader-container { grid-column: span 3; text-align: center; padding: 20px; color: #94a3b8; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-space: around; align-items: center; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; font-size: 10px; gap: 4px; cursor: pointer; }
    .nav-item.active { color: #38bdf8; }
    .nav-item i { font-size: 18px; }
  </style>
</head>
<body>

  <div id="appLaunchAdOverlay">
    <iframe id="appLaunchAdFrame" src="https://omg10.com/4/11117312"></iframe>
    <button id="startSkipBtn" class="start-skip-btn" onclick="closeStartAd()">انتظر (<span id="startTimer">5</span>)</button>
  </div>

  <div class="header">
    <div>
      <div class="app-title">AHMED TV</div>
      <div class="user-tag" id="userInfo">مرحباً بك</div>
    </div>
    <div class="status-badge" id="serverStatus">جاري الفحص</div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="بحث شامل..." oninput="handleSearch(this.value)">
    <i class="fa-solid fa-magnifying-glass"></i>
  </div>

  <div class="main-categories">
    <button class="main-cat-btn active" id="btnLive" onclick="switchMainSection('live')"><i class="fa-solid fa-tv"></i> القنوات</button>
    <button class="main-cat-btn" id="btnMovies" onclick="switchMainSection('movies')"><i class="fa-solid fa-film"></i> الأفلام</button>
    <button class="main-cat-btn" id="btnSeries" onclick="switchMainSection('series')"><i class="fa-solid fa-border-all"></i> المسلسلات</button>
  </div>

  <div class="sub-categories" id="subCategoriesBar"></div>

  <div class="content-grid" id="contentGrid"></div>

  <div class="bottom-nav">
    <div class="nav-item active" id="navLive" onclick="switchMainSection('live')"><i class="fa-solid fa-tv"></i><span>القنوات</span></div>
    <div class="nav-item" id="navMovies" onclick="switchMainSection('movies')"><i class="fa-solid fa-film"></i><span>الأفلام</span></div>
    <div class="nav-item" id="navSeries" onclick="switchMainSection('series')"><i class="fa-solid fa-border-all"></i><span>المسلسلات</span></div>
  </div>

  <script>
    const host = "http://luxipgold.xyz:8080";
    const user = "b0:99:d7:15:88:50";
    const pass = "3090914536649669";

    let currentMainSection = 'live';
    let categoriesList = [];
    let fullDataList = [];
    let filteredList = [];
    let displayedCount = 0;
    const pageSize = 12;
    let canSkipStartAd = false;

    let startTimer = 5;
    
    // تشغيل العداد بضمان تام بعيداً عن تعليق الـ iframe
    const startInterval = setInterval(() => {
      startTimer--;
      const span = document.getElementById('startTimer');
      if (span) span.innerText = startTimer;

      if (startTimer <= 0) {
        clearInterval(startInterval);
        canSkipStartAd = true;
        const btn = document.getElementById('startSkipBtn');
        if (btn) {
          btn.classList.add('active');
          btn.innerHTML = 'تخطي الإعلان <i class="fa-solid fa-arrow-left"></i>';
        }
      }
    }, 1000);

    function closeStartAd() {
      const overlay = document.getElementById('appLaunchAdOverlay');
      if (overlay) overlay.style.display = 'none';
      const iframe = document.getElementById('appLaunchAdFrame');
      if (iframe) iframe.src = 'about:blank';
    }

    // زر احتياطي للطوارئ: لو الإعلان علّق لأي سبب، الضغط في أي مكان على شاشة الإعلان بعد 5 ثوانٍ يغلقه تلقائياً
    document.getElementById('appLaunchAdOverlay').onclick = function(e) {
      if (canSkipStartAd && e.target.id !== 'startSkipBtn') {
        closeStartAd();
      }
    };

    window.onload = function() {
      fetch(`${host}/player_api.php?username=${user}&password=${pass}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.user_info) {
            document.getElementById('serverStatus').innerText = "متصل";
            document.getElementById('userInfo').innerText = data.user_info.username || "أحمد";
          }
        })
        .catch(() => {
          document.getElementById('serverStatus').innerText = "خطأ الاتصال";
        });

      switchMainSection('live');
    };

    function switchMainSection(section) {
      currentMainSection = section;
      document.getElementById('searchInput').value = "";
      
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.main-cat-btn').forEach(el => el.classList.remove('active'));

      if (section === 'live') {
        document.getElementById('navLive').classList.add('active');
        document.getElementById('btnLive').classList.add('active');
      } else if (section === 'movies') {
        document.getElementById('navMovies').classList.add('active');
        document.getElementById('btnMovies').classList.add('active');
      } else if (section === 'series') {
        document.getElementById('navSeries').classList.add('active');
        document.getElementById('btnSeries').classList.add('active');
      }

      fetchCategoriesAndData(section);
    }

    function fetchCategoriesAndData(type) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '<div class="loader-container">جاري جلب المحتوى...</div>';

      let catAction = 'get_live_categories';
      let dataAction = 'get_live_streams';

      if (type === 'movies') {
        catAction = 'get_vod_categories';
        dataAction = 'get_vod_streams';
      } else if (type === 'series') {
        catAction = 'get_series_categories';
        dataAction = 'get_series';
      }

      Promise.all([
        fetch(`${host}/player_api.php?username=${user}&password=${pass}&action=${catAction}`).then(res => res.json()),
        fetch(`${host}/player_api.php?username=${user}&password=${pass}&action=${dataAction}`).then(res => res.json())
      ])
      .then(([cats, data]) => {
        categoriesList = Array.isArray(cats) ? cats : [];
        fullDataList = Array.isArray(data) ? data : [];
        renderSubCategories();
        filterByCategory('all');
      })
      .catch(() => {
        grid.innerHTML = '<div class="loader-container">حدث خطأ أثناء تحميل البيانات</div>';
      });
    }

    function renderSubCategories() {
      const subBar = document.getElementById('subCategoriesBar');
      subBar.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = 'sub-cat-btn active';
      allBtn.innerText = 'الكل';
      allBtn.onclick = (e) => {
        setActiveSubCategory(e.target);
        filterByCategory('all');
      };
      subBar.appendChild(allBtn);

      categoriesList.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'sub-cat-btn';
        btn.innerText = cat.category_name;
        btn.onclick = (e) => {
          setActiveSubCategory(e.target);
          filterByCategory(cat.category_id);
        };
        subBar.appendChild(btn);
      });
    }

    function setActiveSubCategory(selectedBtn) {
      document.querySelectorAll('.sub-cat-btn').forEach(el => el.classList.remove('active'));
      selectedBtn.classList.add('active');
    }

    function filterByCategory(catId) {
      if (catId === 'all') {
        filteredList = fullDataList;
      } else {
        filteredList = fullDataList.filter(item => item.category_id == catId);
      }
      displayedCount = 0;
      document.getElementById('contentGrid').innerHTML = '';
      renderBatch();
    }

    function renderBatch() {
      const grid = document.getElementById('contentGrid');
      const nextBatch = filteredList.slice(displayedCount, displayedCount + pageSize);

      nextBatch.forEach(item => {
        const card = document.createElement('div');
        card.className = 'media-card';

        if (currentMainSection === 'live') {
          const logo = item.stream_icon ? item.stream_icon : '';
          const streamUrl = `${host}/live/${user}/${pass}/${item.stream_id}.m3u8`;
          
          card.onclick = () => {
            if (window.AndroidInterface && window.AndroidInterface.playStream) {
              window.AndroidInterface.playStream(streamUrl, true);
            }
          };
          card.innerHTML = `
            <span class="live-badge">LIVE</span>
            ${logo ? `<img src="${logo}" class="channel-logo" loading="lazy">` 
                   : `<div style="padding: 20px 10px; color: #38bdf8; font-size: 32px;"><i class="fa-solid fa-tv"></i></div>`}
            <div class="media-title">${item.name}</div>
          `;
        } 
        else if (currentMainSection === 'movies') {
          const poster = item.stream_icon ? item.stream_icon : 'https://via.placeholder.com/150/0b1120/ffffff?text=Movie';
          const ext = item.container_extension || 'mp4';
          const movieUrl = `${host}/movie/${user}/${pass}/${item.stream_id}.${ext}`;
          
          card.onclick = () => {
            if (window.AndroidInterface && window.AndroidInterface.playStream) {
              window.AndroidInterface.playStream(movieUrl, false);
            }
          };
          card.innerHTML = `
            <img src="${poster}" class="media-poster" loading="lazy">
            <div class="media-title">${item.name}</div>
          `;
        }

        grid.appendChild(card);
      });

      displayedCount += nextBatch.length;
    }

    function handleSearch(keyword) {
      const query = keyword.trim().toLowerCase();
      filteredList = fullDataList.filter(item => {
        const name = (item.name || "").toLowerCase();
        return name.includes(query);
      });
      displayedCount = 0;
      document.getElementById('contentGrid').innerHTML = '';
      renderBatch();
    }
  </script>
</body>
</html>
